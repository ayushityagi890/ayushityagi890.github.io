---
layout: default
---

<div class="page-content">
  {% if page.top_image %}
  <div class="featured-image">
    <img src="{{ site.github.url }}/assets/img/{{ page.top_image }}" />
  </div>
  {% endif %}

  <h1>{{ page.title }}</h1>
  <article>{{ content }}</article>

  {% if page.bottom_image %}
  <div class="featured-image">
    <img src="{{ site.github.url }}/assets/img/{{ page.bottom_image }}" />
  </div>
  {% endif %}
</div>
